<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Server Error | ReportGen</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --ink:#0a0f1e; --blue2:#2563eb; --blue3:#3b7bff; --white:#ffffff; --muted:#64748b; }
        body { font-family:'DM Sans',sans-serif; background:var(--ink); color:var(--white); min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:2rem; overflow:hidden; }
        body::before { content:''; position:fixed; inset:0; background:radial-gradient(ellipse 60% 50% at 20% 20%,rgba(37,99,235,0.18),transparent 70%),radial-gradient(ellipse 50% 60% at 80% 80%,rgba(239,68,68,0.10),transparent 70%); pointer-events:none; z-index:0; }
        .content { position:relative; z-index:1; max-width:560px; }
        .error-code { font-family:'Playfair Display',serif; font-size:clamp(6rem,18vw,10rem); font-weight:800; line-height:1; background:linear-gradient(135deg,#ef4444,#f97316,#fbbf24); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:1rem; letter-spacing:-0.03em; }
        h1 { font-family:'Playfair Display',serif; font-size:clamp(1.5rem,4vw,2.2rem); font-weight:700; color:var(--white); margin-bottom:1rem; }
        p { font-size:1rem; color:var(--muted); line-height:1.65; margin-bottom:2rem; }
        .actions { display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; }
        .btn-primary { display:inline-flex; align-items:center; gap:8px; background:linear-gradient(135deg,#2563eb,#3b7bff); color:white; border:none; border-radius:10px; padding:12px 24px; font-size:0.9rem; font-weight:600; text-decoration:none; box-shadow:0 4px 16px rgba(37,99,235,0.4); }
        .btn-ghost { display:inline-flex; align-items:center; gap:8px; background:transparent; color:rgba(255,255,255,0.6); border:1.5px solid rgba(255,255,255,0.15); border-radius:10px; padding:12px 24px; font-size:0.9rem; font-weight:500; text-decoration:none; }
        .logo { display:flex; align-items:center; gap:8px; justify-content:center; margin-bottom:2.5rem; text-decoration:none; color:white; font-family:'Playfair Display',serif; font-size:1.1rem; font-weight:800; }
        .logo-mark { width:28px; height:28px; background:#2563eb; border-radius:7px; display:flex; align-items:center; justify-content:center; }
        .logo-mark svg { fill:white; }
    </style>
</head>
<body>
    <div class="content">
        <a href="/" class="logo">
            <div class="logo-mark">
                <svg viewBox="0 0 16 16" width="11" height="11">
                    <path d="M3 2h10v1H3zM3 5h7v1H3zM3 8h10v1H3zM3 11h5v1H3z"/>
                </svg>
            </div>
            ReportGen
        </a>

        <div class="error-code">500</div>
        <h1>Something went wrong</h1>
        <p>Our server hit an unexpected error. We've been notified and are working on it.<br>Please try again in a few moments.</p>

        <div class="actions">
            <a href="/" class="btn-primary">← Go Home</a>
            <a href="javascript:window.location.reload()" class="btn-ghost">Try Again</a>
        </div>
    </div>
</body>
</html>
